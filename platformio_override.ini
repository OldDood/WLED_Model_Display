[env:esp32s3dev_16MB_opi]
board = esp32-s3-devkitc-1
platform = espressif32@6.7.0
framework = arduino

platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.14

# --- HARDWARE OVERRIDES (Corrected for eFuse mismatch) ---
# We use 'qio' for flash to satisfy the eFuse, but keep 'opi' for the RAM
board_build.arduino.memory_type = qio_opi 
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.f_flash = 80000000L 

# --- COMPILER OVERRIDES ---
build_unflags = -std=gnu++11 -std=gnu++17
build_flags = 
  ${common.build_flags}
  -std=gnu++14
  -D BOARD_HAS_PSRAM
  -D CONFIG_SPIRAM_MODE_OCTAL=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D ADC_ATTEN_DB_12=ADC_ATTEN_DB_11